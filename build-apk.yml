
name: Build DYNX VIP APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q DYNX_VIP_Source_With_APK_Build_Workflow.zip -d source

      - name: Build APK
        working-directory: source/Fakelag-main/fakelag/fakelag-beta
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DYNX-VIP-debug-apk
          path: source/Fakelag-main/fakelag/fakelag-beta/app/build/outputs/apk/debug/app-debug.apk
