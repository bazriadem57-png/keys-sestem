<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Silent ExE - PURPLE ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #090214; font-family: 'Poppins', Arial; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 460px; background: rgba(255, 255, 255, 0.03); padding: 35px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); }
        h2 { font-family: 'Orbitron'; color: #ffffff; text-align: center; }
        .section-box { margin-bottom: 20px; padding: 18px; border-radius: 20px; background: rgba(9, 2, 20, 0.6); border: 1px solid #ba68c8; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #090214; border: 1px solid #ba68c8; color: white; border-radius: 10px; }
        button { width: 100%; padding: 10px; background: #7b1fa2; border: none; color: white; border-radius: 10px; cursor: pointer; }
        .msg { color: #00ff99; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    {% if not session.get('logged_in') %}
        <h2>SYSTEM AUTH</h2>
        <form method="POST">
            <input type="password" name="pass" placeholder="ENTER ACCESS KEY" required>
            <button type="submit">UNLOCK PANEL</button>
        </form>
    {% else %}
        <h2>MASTER PANEL</h2>
        {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}

        <div class="section-box">
            <form method="POST">
                <select name="m_status">
                    <option value="0" {% if m_mode==0 %}selected{% endif %}>ONLINE</option>
                    <option value="1" {% if m_mode==1 %}selected{% endif %}>MAINTENANCE</option>
                </select>
                <button type="submit" name="toggle_maintenance">APPLY STATUS</button>
            </form>
        </div>

        <div class="section-box">
            <form method="POST">
                <select name="days">
                    <option value="1">1 DAY</option>
                    <option value="30">30 DAYS</option>
                </select>
                <button type="submit" name="generate_direct">GENERATE KEY</button>
            </form>
        </div>

        <div class="section-box">
            <form method="POST">
                <input type="text" name="res_user" placeholder="USERNAME" required>
                <input type="text" name="res_pass" placeholder="PASSWORD" required>
                <button type="submit" name="add_reseller">CREATE ACCOUNT</button>
            </form>
            <br>
            <form method="POST">
                <select name="res_id">
                    {% for res in resellers %}
                    <option value="{{ res.id }}">{{ res.username }} ({{ res.points }} PTS)</option>
                    {% endfor %}
                </select>
                <input type="number" name="pts" placeholder="POINTS" required>
                <button type="submit" name="update_points" value="add">ADD</button>
                <button type="submit" name="update_points" value="sub" style="background:#d32f2f; margin-top:5px;">SUB</button>
            </form>
        </div>
        <a href="/logout" style="color:red;">LOGOUT</a>
    {% endif %}
</div>
</body>
</html>
