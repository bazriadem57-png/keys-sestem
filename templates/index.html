<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Master Panel</title>
</head>
<body>
    <h1>لوحة تحكم النظام</h1>
    
    {% if not session.get('logged_in') %}
    <form method="POST">
        <input type="password" name="pass" placeholder="أدخل كلمة المرور">
        <button type="submit">دخول</button>
    </form>
    {% else %}
    <form method="POST">
        <button type="submit" name="generate_direct">توليد كود جديد</button>
    </form>
    {% if msg %}<p style="color:green;">{{ msg }}</p>{% endif %}
    {% endif %}
</body>
</html>
